name: Deploy to Contabo

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd /home/deploy/apps/ABGP/abgp
            sudo -u deploy git fetch origin main
            sudo -u deploy git checkout main
            sudo -u deploy git reset --hard origin/main
            sudo -u deploy chmod +x scripts/deploy-production.sh
            APP_DIR=/home/deploy/apps/ABGP/abgp APP_USER=deploy bash scripts/deploy-production.sh
